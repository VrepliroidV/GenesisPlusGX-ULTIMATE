name: Genesis Plus GX ULTIMATE Wii Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build Wii
    runs-on: ubuntu-latest
    # libogc 3 (2026) removed lwp_threads.h, which the menu still uses
    container: devkitpro/devkitppc:20251231
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Build Wii
      shell: bash
      run: |
        set -o pipefail
        if ! make -k -f Makefile.wii -j2 2>&1 | tee build.log; then
          msg=$(grep -E -B1 "error:|Error [0-9]|undefined reference|cannot find|No such file|not found" build.log | grep -v "^--$" | awk '!seen[$0]++' | head -n 150 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Wii build failed::$msg"
          exit 1
        fi

    # Static data must fit in MEM1 (24 MB, the cartridge area alone is 15 MB)
    - name: Memory use
      shell: bash
      run: |
        elf=genplus_wii.elf
        nm=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-nm
        end=$($nm "$elf" | awk '($3 == "_end" || $3 == "__bss_end") && !e { e = $1 } END { print e }')
        cfg=$($nm -S "$elf" | awk '$4 == "config" && !c { c = $2 } END { print c }')
        sizes=$(/opt/devkitpro/devkitPPC/bin/powerpc-eabi-size "$elf" | awk 'END { print }')
        echo "::notice title=Memory use::end of static data 0x$end (MEM1 ends at 0x81800000); config 0x$cfg bytes; size: $sizes"
        p32=$(grep -m1 'picodrive_core.o:' build.log | cut -c1-900 || true)
        echo "::notice title=32X core::$p32"
        # Some buffers must be in MEM1 (the IPL font is read there by DMA) and
        # the loaders keep the top of MEM1: a build ending at 0x816d1520 did
        # not start, one ending at 0x81692da0 did.
        if [ $((16#$end)) -gt $((16#816a0000)) ]; then
          echo "::error title=Memory use::static data ends at 0x$end, past 0x816a0000: too little MEM1 left at start-up"
          exit 1
        fi

    - name: Package for the Homebrew Channel
      run: |
        mkdir -p dist/apps/genplusultimate dist/genplusultimate/roms dist/genplusultimate/bezels
        touch dist/genplusultimate/roms/romsdir dist/genplusultimate/bezels/bezelsdir
        # menu music: the OGG files of music/ in this repository
        mkdir -p dist/genplusultimate/music
        if ls music/*.ogg >/dev/null 2>&1; then cp music/*.ogg dist/genplusultimate/music/; else touch dist/genplusultimate/music/musicdir; fi
        cp genplus_wii.dol dist/apps/genplusultimate/boot.dol
        cp gx/hbc/meta.xml gx/hbc/icon.png LICENSE.txt dist/apps/genplusultimate/
        # Sega 32X: PicoDrive's license and authors
        cp picodrive/COPYING dist/apps/genplusultimate/PICODRIVE_LICENSE.txt
        cp picodrive/AUTHORS dist/apps/genplusultimate/PICODRIVE_AUTHORS.txt

    - name: Upload Wii build
      uses: actions/upload-artifact@v4
      with:
        name: GenesisPlusGXUltimate-Wii
        path: dist/

    # Test builds of the 32x branch: the same files on the 32x-build branch
    - name: Publish the 32x test build
      if: github.event_name == 'push' && github.ref == 'refs/heads/32x'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)
        cd dist
        git init -q -b 32x-build
        git config user.name "github-actions[bot]"
        git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Wii build of ${GITHUB_SHA::7}"
        git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:32x-build

  # Publishing a release on GitHub (for example tag v1.0.0) builds it and
  # attaches the build as a .zip file. If the release text is empty, it is
  # filled from .github/RELEASE_NOTES.md.
  release:
    name: Attach the files to the release
    needs: build
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'libretro')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: GenesisPlusGXUltimate-Wii
        path: artifacts

    - name: Zip and publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        (cd artifacts && zip -r -X "$GITHUB_WORKSPACE/GenesisPlusGXUltimate-Wii.zip" .)
        if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
          gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
        fi
        gh release upload "$TAG" GenesisPlusGXUltimate-Wii.zip --clobber
